name: Deploy Wehrit

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Website bauen
        run: npm run build

      - name: SSH-Key laden
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Host-Key vertrauen
        run: mkdir -p ~/.ssh && ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Per rsync deployen
        run: |
          rsync -avzr --delete \
            dist/ \
            package.json \
            package-lock.json \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/srv/websites/wehrit/

      - name: Server neu starten
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /srv/websites/wehrit
            npm ci --omit=dev
            pm2 restart wehrit || pm2 start dist/server/entry.mjs --name wehrit
          EOF
